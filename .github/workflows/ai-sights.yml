name: Sight grades (smart guide)
# Run by hand (or weekly): the smart guide grades, in each ready city, the real sights (must, good, skip, minutes and a tip)
# (tools/ai-sights.mjs). Only cities without grades of the current version are done, unless cities are given.
on:
  workflow_dispatch:
    inputs:
      cities: { description: "slugs, space separated (empty: every city that needs it)", required: false, default: "" }
  schedule: [{ cron: "47 4 * * 0" }]
permissions: { contents: write }
concurrency: { group: ai-sights, cancel-in-progress: false }
jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20 }
      - name: Pick
        env: { GEMINI_KEY: "${{ secrets.GEMINI_KEY }}", COMMIT_EACH: "1", INPUT_CITIES: "${{ github.event.inputs.cities }}" }
        run: |
          git config user.name "masa-bot"; git config user.email "actions@users.noreply.github.com"
          WANT=$(printf '%s' "$INPUT_CITIES" | tr -cd 'a-z -')
          node tools/ai-sights.mjs $WANT | tee out.txt
          grep -E "→|failed" out.txt | head -40 | while read -r l; do echo "::notice::$l"; done
