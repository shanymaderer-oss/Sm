name: Security rules test
# Runs the Firestore security rules against attacks (tools/firebase/rules.test.mjs) in the official emulator.
on:
  push:
    paths: ["firestore.rules", "tools/firebase/**", ".github/workflows/rules.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/firebase
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Rules tests
        run: |
          set +e
          npm run test:rules > out.txt 2>&1
          code=$?
          cat out.txt
          # show the important lines as an annotation (readable from the API without the log)
          msg=$(grep -E "^not ok|^# (pass|fail)|Error|FAILED|failed|assert|PERMISSION|expected" out.txt | head -40 | sed 's/%/%25/g' | tr '\n' '~' | sed 's/~/%0A/g')
          echo "::notice title=rules-tests::${msg:-no summary lines}"
          exit $code
      - name: The committed bundle matches the build
        run: |
          npm run build
          git diff --exit-code -- ../../vendor/firebase/masa-firebase.js || (echo "vendor/firebase/masa-firebase.js is not the output of tools/firebase/entry.js" && exit 1)
