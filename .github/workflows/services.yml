name: Services and accounts check
# Live: every outside service and link the site uses, with the real network. Cloud: accounts end to end on the Firebase emulators.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"
  push:
    paths: ["tools/qa/live_check.py", "tools/qa/test_cloud.py", "js/cloud.js", ".github/workflows/services.yml"]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      QA_URL: https://shanymaderer-oss.github.io/Sm
      QA_OUT: qa-out/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Live check
        run: |
          set +e
          python tools/qa/live_check.py > out.txt 2>&1
          code=$?
          cat out.txt
          msg=$(tail -c 60000 out.txt | sed 's/%/%25/g' | tr '\n' '~' | sed 's/~/%0A/g')
          echo "::notice title=live-check::${msg}"
          exit $code
      - name: Save the report to the qa-report-live branch
        if: always()
        run: |
          mkdir -p /tmp/rep && cp -r out.txt qa-out /tmp/rep/ 2>/dev/null || true
          git config user.name "masa-bot"; git config user.email "actions@users.noreply.github.com"
          git switch --orphan report-tmp
          git rm -rqf --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/rep/. .
          git add -A && git commit -qm "report $(date -u +%F-%H%M)" && git push -qf origin HEAD:refs/heads/qa-report-live
  cloud:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          cd tools/firebase && npm ci
      - name: Accounts end to end
        run: |
          set +e
          python -m http.server 8790 > /dev/null 2>&1 &
          tools/firebase/node_modules/.bin/firebase emulators:exec --only auth,firestore --project demo-masa "python tools/qa/test_cloud.py" > out.txt 2>&1
          code=$?
          cat out.txt
          msg=$(grep -E "^(PASS|FAIL)|ALL PASSED|FAILED|Error|error" out.txt | head -60 | sed 's/%/%25/g' | tr '\n' '~' | sed 's/~/%0A/g')
          echo "::notice title=cloud-test::${msg}"
          exit $code
      - name: Save the report to the qa-report-cloud branch
        if: always()
        run: |
          mkdir -p /tmp/rep && cp -r out.txt qa-out /tmp/rep/ 2>/dev/null || true
          git config user.name "masa-bot"; git config user.email "actions@users.noreply.github.com"
          git switch --orphan report-tmp
          git rm -rqf --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/rep/. .
          git add -A && git commit -qm "report $(date -u +%F-%H%M)" && git push -qf origin HEAD:refs/heads/qa-report-cloud
