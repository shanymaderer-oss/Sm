name: Services and accounts check
# Live: every outside service and link the site uses, with the real network. Cloud: accounts end to end on the Firebase emulators.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"
  push:
    paths: ["tools/qa/live_check.py", "tools/qa/test_cloud.py", "js/cloud.js", ".github/workflows/services.yml"]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_URL: https://shanymaderer-oss.github.io/Sm
      QA_OUT: qa-out/
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Live check
        run: |
          set +e
          python tools/qa/live_check.py > out.txt 2>&1
          code=$?
          cat out.txt
          msg=$(tail -c 60000 out.txt | sed 's/%/%25/g' | tr '\n' '~' | sed 's/~/%0A/g')
          echo "::notice title=live-check::${msg}"
          exit $code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: live-check
          path: qa-out/
          retention-days: 14
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          cd tools/firebase && npm ci
      - name: Accounts end to end
        run: |
          set +e
          python -m http.server 8790 > /dev/null 2>&1 &
          cd tools/firebase
          npx firebase emulators:exec --only auth,firestore --project demo-masa "python ../qa/test_cloud.py" > ../../out.txt 2>&1
          code=$?
          cd ../..
          cat out.txt
          msg=$(grep -E "^(PASS|FAIL)|ALL PASSED|FAILED|Error|error" out.txt | head -60 | sed 's/%/%25/g' | tr '\n' '~' | sed 's/~/%0A/g')
          echo "::notice title=cloud-test::${msg}"
          exit $code
