name: Guide server check
# Run by hand: asks the guide server one question the way the site does, and reports the answer and how long it took.
on: workflow_dispatch
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the guide
        run: |
          for q in 'מה כדאי לראות ברומא ביום אחד? תשובה של שני משפטים.' 'Say hello in Hebrew.'; do
            S=$(date +%s)
            A=$(curl -s -m 120 -X POST https://masa-ai.sivanmad7.workers.dev/generate -H 'Origin: https://shanymaderer-oss.github.io' -H 'Content-Type: application/json' \
              -d "{\"contents\":[{\"role\":\"user\",\"parts\":[{\"text\":\"$q\"}]}],\"generationConfig\":{\"maxOutputTokens\":400}}" | head -c 400 | tr '\n' ' ')
            echo "::notice title=answer in $(( $(date +%s) - S ))s::$A"
          done
      - name: Ask from the live site in a real browser
        run: |
          pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium >/dev/null
          python - <<'PY'
          import asyncio, time
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(); pg = await b.new_page()
                  await pg.goto("https://shanymaderer-oss.github.io/Sm/index.html"); await pg.wait_for_timeout(1500)
                  t = time.time()
                  a = await pg.evaluate("Masa.ai.enabled() ? Masa.ai.chat('ענה בעברית, משפט אחד.', [{role:'user', content:'מה מומלץ לאכול ברומא?'}]).catch(e => 'ERR ' + e.code) : 'guide is off'")
                  print(f"::notice title=live site in {time.time()-t:.1f}s::{a[:300]}")
                  await b.close()
          asyncio.run(main())
          PY
