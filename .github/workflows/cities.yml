name: Refresh city data
on:
  workflow_dispatch:
    inputs:
      cities:
        description: "City slugs separated by spaces (empty = all)"
        required: false
  push:
    paths: ["tools/fetch-cities.mjs", "js/sources.js", "js/cities.js"]
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: write
concurrency:
  group: city-data
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: |
          git config user.name "masa-bot"
          git config user.email "actions@users.noreply.github.com"
          # the city list comes from a form field: pass it as data, never paste it into the shell
          CITIES=$(printf '%s' "$INPUT_CITIES" | tr -cd 'a-z -')
          node tools/fetch-cities.mjs $CITIES
        env:
          COMMIT_EACH: "1"
          INPUT_CITIES: ${{ github.event.inputs.cities }}
      - name: Commit data
        if: always()
        run: |
          git add data/cities
          git diff --cached --quiet || (git commit -m "עדכון נתוני ערים" && git push)
