name: Refresh city data
on:
  workflow_dispatch:
    inputs:
      cities:
        description: "City slugs separated by spaces (empty = all)"
        required: false
  push:
    paths: ["tools/fetch-cities.mjs", "js/sources.js", "js/cities.js"]
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: write
concurrency:
  group: city-data
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          git config user.name "masa-bot"
          git config user.email "actions@users.noreply.github.com"
          node tools/fetch-cities.mjs ${{ github.event.inputs.cities }}
        env:
          COMMIT_EACH: "1"
      - name: Commit data
        if: always()
        run: |
          git add data/cities
          git diff --cached --quiet || (git commit -m "עדכון נתוני ערים" && git push)
