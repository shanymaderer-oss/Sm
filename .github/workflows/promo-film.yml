name: Promo film
# On demand: film the live site at phone size for a promo video (real map, flight prices, photos).
on:
  workflow_dispatch:
    inputs:
      city:
        description: "City to film (Hebrew)"
        default: "רומא"
permissions:
  contents: read
jobs:
  film:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install browser and Hebrew fonts
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core fonts-noto-color-emoji >/dev/null
      - name: Film
        env:
          CITY: ${{ inputs.city }}
          OUT: screens
        run: python tools/promo/film_screens.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens
          path: screens/
          retention-days: 7
