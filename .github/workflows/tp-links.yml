name: Partner link pattern (Travelpayouts)
# Run by hand: asks the Travelpayouts links API for long partner links to a few brand pages, so the site can build
# such links itself (no API call per visitor). The links are public (they carry the partner id, not the token).
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask for long links
        env: { TP_TOKEN: "${{ secrets.TP_TOKEN }}" }
        run: |
          body='{"trs":594662,"marker":799451,"shorten":false,"links":[{"url":"https://www.tiqets.com/en/"},{"url":"https://www.tiqets.com/en/rome-attractions-c71631/"},{"url":"https://www.klook.com/en-US/"},{"url":"https://www.klook.com/en-US/city/34-rome-things-to-do/"}]}'
          curl -sS -X POST https://api.travelpayouts.com/links/v1/create -H "X-Access-Token: $TP_TOKEN" -H "Content-Type: application/json" -d "$body" > r.json
          python3 -c "import json;d=json.load(open('r.json'));print(d.get('code'),d.get('status'));[print('::notice::'+l.get('code','')+' '+(l.get('partner_url') or l.get('message',''))) for l in (d.get('result') or {}).get('links',[])]" || cat r.json | head -c 400
